  .chat .m.mine .who{color:var(--seal)}
  .chat .empty2{color:var(--ink-3);font-size:13px;text-align:center;margin:auto}
  .chat form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
  .chat input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink)}
  .chat form button{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:0 14px;font:inherit;font-size:13px}
  .chat .ppl{display:grid}.chat .ppl button{display:flex;justify-content:space-between;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px;font:inherit;font-size:14px;color:var(--ink)}
  .chat .ppl button span{font-size:12px;color:var(--ink-3)}.chat .ppl button b{color:var(--seal);font-weight:400;font-size:12px}`;
  document.head.appendChild(st);
  const btn=document.createElement("button");btn.type="button";btn.className="chat-btn";btn.innerHTML="대화";
  const box=document.createElement("div");box.className="chat";box.hidden=true;box.setAttribute("role","dialog");box.setAttribute("aria-label","대화");
  document.body.append(box,btn);
  let tab="server",dmWith=null,last=0;const msgs={},unsub={};
  const seen=k=>{try{return +localStorage.getItem("murim-seen-"+k)||0}catch(e){return 0}};
  /* 읽은 표시는 내 기기 시계가 아니라 마지막으로 본 대화의 서버 시각으로 남긴다 */
  const mark=k=>{const last=(msgs[k]||[]).reduce((a,m)=>Math.max(a,m.t||0),0);if(!last)return;try{if(last>seen(k))localStorage.setItem("murim-seen-"+k,last)}catch(e){}};
  const heroName=()=>(typeof me!=="undefined"&&me?.name)||window.__murim.id;
  const myLoc=()=>typeof me!=="undefined"&&me&&!me.travel?me.loc:null;
  const peers=()=>typeof others!=="undefined"?others.filter(o=>o._id&&!String(o._id).startsWith("fake-")):[];
  const pair=o=>[uid,o].sort().join("_");
  const keyOf=(t,x)=>t==="dm"?"dm:"+pair(x):"ch:"+x;
  let pq=false;const later=()=>{if(pq)return;pq=true;setTimeout(()=>{pq=false;paint()},0)};
  function listen(key,ref){if(unsub[key])return;unsub[key]=true;unsub[key]=ref.orderBy("st","desc").limit(key.startsWith("dm:")?20:30).onSnapshot(s=>{msgs[key]=s.docs.map(d=>{const x=d.data({serverTimestamps:"estimate"})||{},st=x.st&&x.st.toMillis?x.st.toMillis():(typeof x.st==="number"?x.st:Date.now());return {...x,id:d.id,t:st}}).reverse();later()},()=>{})}
  function ensure(){listen("ch:server",fs.collection("chat/server/msgs"));
    const l=myLoc();if(l)listen("ch:"+l,fs.collection(`chat/${l}/msgs`));
    peers().forEach(o=>listen(keyOf("dm",o._id),fs.collection(`dm/${pair(o._id)}/msgs`)))}
  const unread=k=>(msgs[k]||[]).some(m=>m.t>seen(k)&&m.from!==uid);
  function curKey(){return tab==="server"?"ch:server":tab==="region"?(myLoc()?"ch:"+myLoc():null):dmWith?keyOf("dm",dmWith):null}
  function paint(){
    ensure();
    const l=myLoc(),dmKeys=peers().map(o=>keyOf("dm",o._id)),anyDm=dmKeys.some(unread);
    const total=["ch:server",l?"ch:"+l:null,...dmKeys].filter(Boolean).filter(k=>!(box.hidden===false&&k===curKey())&&unread(k)).length;
    btn.innerHTML=`대화${total?`<b>${total}</b>`:""}`;
    if(box.hidden)return;
    const k=curKey();if(k)mark(k);
    const tabs=`<div class="ct"><button type="button" data-t="server" aria-selected="${tab==="server"}">서버${tab!=="server"&&unread("ch:server")?"<i></i>":""}</button><button type="button" data-t="region" aria-selected="${tab==="region"}">지역${tab!=="region"&&l&&unread("ch:"+l)?"<i></i>":""}</button><button type="button" data-t="dm" aria-selected="${tab==="dm"}">1:1${tab!=="dm"&&anyDm?"<i></i>":""}</button><button class="cx" type="button" aria-label="닫기">×</button></div>`;
    let body="",sub="",canSend=!!k;
    if(tab==="server")sub=`<div class="sub"><span>무림 전체에 들리는 이야기</span></div>`;
    if(tab==="region")sub=`<div class="sub"><span>${l?`${REG[l]}에 있는 사람들만 듣는다`:"길 위에서는 지역 대화를 할 수 없다"}</span></div>`;
    if(tab==="dm"&&!dmWith){canSend=false;const ps=peers();
      body=`<div class="ppl">${ps.length?ps.map(o=>`<button type="button" data-dm="${o._id}">${o.name}<span>${unread(keyOf("dm",o._id))?"<b>새 귓속말</b>":((msgs[keyOf("dm",o._id)]||[]).slice(-1)[0]?.text||"").slice(0,18)}</span></button>`).join(""):`<p class="empty2" style="padding:20px">아직 귓속말을 나눌 사람이 없다.</p>`}</div>`}
    else{if(tab==="dm"){const o=peers().find(x=>x._id===dmWith);sub=`<div class="sub"><span>${o?(typeof josa==="function"?josa(o.name,"와"):o.name):"?"} 귓속말</span><button type="button" id="dmBack">목록</button></div>`}
      const list=k?msgs[k]||[]:[];
      body=`<div class="msgs" id="chatMsgs">${list.length?list.map(m=>{const d=new Date(m.t);return `<div class="m ${m.from===uid?"mine":""}"><img class="cav" alt="" hidden><div><span class="who"></span><span class="tx"></span><span class="tm">${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</span></div></div>`}).join(""):`<p class="empty2">${k?"아직 아무 말도 없다. 먼저 말을 걸어 보자.":""}</p>`}</div>`}
    const form=canSend?`<form id="chatForm"><input id="chatIn" maxlength="200" autocomplete="off" placeholder="${tab==="dm"?"귓속말":"말하기"} (200자까지)" aria-label="보낼 말"><button type="submit">보내기</button></form>`:"";
    const keepDraft=$c("#chatIn")?.value||"";const hadFocus=document.activeElement?.id==="chatIn";
    box.innerHTML=tabs+sub+body+form;
    const list=k?msgs[k]||[]:[];box.querySelectorAll(".m").forEach((el,i)=>{el.querySelector(".who").textContent=list[i].name||"?";el.querySelector(".tx").textContent=list[i].text;const a=typeof avatars!=="undefined"&&avatars[list[i].from];if(typeof okImg==="function"&&okImg(a)){const im=el.querySelector(".cav");im.src=a;im.hidden=false}});
    const ml=$c("#chatMsgs");if(ml)ml.scrollTop=ml.scrollHeight;
    if($c("#chatIn")){$c("#chatIn").value=keepDraft;if(hadFocus)$c("#chatIn").focus()}
    box.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab!=="dm")dmWith=null;paint()});
    box.querySelector(".cx").onclick=()=>{box.hidden=true;paint()};
    box.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{dmWith=b.dataset.dm;paint()});
    if($c("#dmBack"))$c("#dmBack").onclick=()=>{dmWith=null;paint()};
    if($c("#chatForm"))$c("#chatForm").onsubmit=async e=>{e.preventDefault();const inp=$c("#chatIn"),text=inp.value.trim().slice(0,200);if(!text)return;
      if(Date.now()-last<600){alertLine("조금만 천천히 보내 주세요.");return}last=Date.now();inp.value="";
      const ref=tab==="dm"?fs.collection(`dm/${pair(dmWith)}/msgs`):fs.collection(`chat/${tab==="server"?"server":myLoc()}/msgs`);
      try{await ref.add({from:uid,name:heroName(),text,t:Date.now(),st:firebase.firestore.FieldValue.serverTimestamp()})}catch(x){inp.value=text;alertLine("보내지 못했어요. 잠시 뒤 다시 해 주세요.")}};
  }
  function alertLine(t){const s=box.querySelector(".sub span");if(s)s.textContent=t}
  btn.onclick=()=>{box.hidden=!box.hidden;paint();if(!box.hidden)setTimeout(()=>$c("#chatIn")?.focus(),50)};
  addEventListener("keydown",e=>{if(e.key==="Escape"&&!box.hidden){box.hidden=true;paint()}});
  setInterval(()=>{ensure();if(box.hidden)paint()},5000);
  paint();
});

/* 새 판 알림: 올라가 있는 index.html 의 판 번호가 지금 화면과 다르면 아래에 안내를 띄운다 */
(()=>{
  const mine=document.querySelector('meta[name="murim-build"]')?.content;if(!mine)return;
  const bar=document.createElement("div");bar.className="newver";bar.hidden=true;bar.setAttribute("role","status");
  bar.innerHTML=`<span>새로운 무림을 불러옵니다. 새로고침을 부탁드립니다.</span><button type="button">새로고침</button>`;
  bar.querySelector("button").onclick=()=>location.reload();
  const st=document.createElement("style");st.textContent=`.newver{position:fixed;left:16px;right:16px;margin:0 auto;max-width:520px;justify-content:space-between;bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:12px;align-items:center;padding:10px 12px 10px 16px;background:var(--ink);color:var(--paper);font-size:14px;border-radius:2px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
  .newver[hidden]{display:none}.newver button{flex:none;font:inherit;font-size:13px;padding:5px 12px;background:var(--seal);color:#fff;border:0;border-radius:2px;cursor:pointer}`;
  document.head.appendChild(st);document.body.appendChild(bar);
  let last=0;
  async function check(){if(Date.now()-last<60e3)return;last=Date.now();
    try{const t=await (await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"})).text();
      const m=t.match(/<meta name="murim-build" content="([^"]+)"/);if(m&&m[1]!==mine)bar.hidden=false}catch(e){}}
  setInterval(check,5*60e3);addEventListener("visibilitychange",()=>{if(!document.hidden)check()});addEventListener("focus",check);
  setTimeout(check,30e3);
})();
</script>
</body></html>
