<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="murim-build" content="20261026012931">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>무림행</title>
<meta name="theme-color" content="#E2DED3">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&display=swap">
<style>
/* 수묵화: 한지 위 먹 번짐, 위쪽에 먹산 한 폭, 낙관(붉은 도장)만 유일한 색. 한 줄 세로 흐름. */
:root{
  --paper:#E2DED3; --paper-2:#D6D1C4; --ink:#1D1E1B; --ink-2:#4A4A43; --ink-3:#85827A; --stain:rgba(140,118,80,.13);
  --line:rgba(29,30,27,.16); --seal:#B0382A; --seal-soft:rgba(176,56,42,.10);
  --grain:.35; --mist:rgba(236,235,228,0);
  --c-sorim:#B0700F; --c-hwasan:#B5375C; --c-ami:#6A54A6; --c-mudang:#2B5C8C; --c-dang:#367348; --c-namgung:#8A3B2B; --c-kunlun:#55697A; --c-jegal:#1E7A72;
  --f-brush:"Song Myung","Gowun Batang",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141519; --paper-2:#1C1D22; --ink:#E5E2D6; --ink-2:#B0ADA2; --ink-3:#72706A;
  --line:rgba(229,226,214,.14); --seal:#CF5A43; --seal-soft:rgba(207,90,67,.14); --grain:.18; --stain:rgba(0,0,0,.18); --c-sorim:#E2A64B; --c-hwasan:#E5789A; --c-ami:#A893DE; --c-mudang:#72A3D3; --c-dang:#7BBB8C; --c-namgung:#D98A6E; --c-kunlun:#A9BCCB; --c-jegal:#6CC4B8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141519; --paper-2:#1C1D22; --ink:#E5E2D6; --ink-2:#B0ADA2; --ink-3:#72706A;
  --line:rgba(229,226,214,.14); --seal:#CF5A43; --seal-soft:rgba(207,90,67,.14); --grain:.18; --stain:rgba(0,0,0,.18); --c-sorim:#E2A64B; --c-hwasan:#E5789A; --c-ami:#A893DE; --c-mudang:#72A3D3; --c-dang:#7BBB8C; --c-namgung:#D98A6E; --c-kunlun:#A9BCCB; --c-jegal:#6CC4B8; color-scheme:dark}

*{box-sizing:border-box}
body{background:radial-gradient(ellipse 60% 40% at 8% 30%,var(--stain),transparent 70%),radial-gradient(ellipse 45% 35% at 92% 70%,var(--stain),transparent 70%),radial-gradient(ellipse 120% 90% at 50% 50%,transparent 55%,var(--stain)),var(--paper);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--grain);z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .44  0 0 0 0 .40  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");mix-blend-mode:multiply}
:root[data-theme="dark"] body::after{mix-blend-mode:screen}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::after{mix-blend-mode:screen}}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--seal);outline-offset:3px}

/* 머리: 먹산 */
.head{position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
#mount{display:block;width:100%;height:190px}
.title{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:22px;
  max-width:720px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.title h1{font-family:var(--f-brush);font-size:clamp(34px,8.5vw,50px);line-height:1.05;letter-spacing:.08em}
.title small{display:block;font-size:13px;color:var(--ink-2);letter-spacing:.14em;margin-top:6px}
.seal{display:inline-grid;place-items:center;border:2px solid var(--seal);color:var(--seal);font-family:var(--f-brush);
  border-radius:4px;transform:rotate(-4deg);background:var(--seal-soft);line-height:1}
.seal.big{width:58px;height:58px;font-size:20px;writing-mode:vertical-rl}
.seal.sm{width:34px;height:34px;font-size:12px;writing-mode:vertical-rl;flex:none}

.status{font-size:13px;color:var(--ink-3);margin:6px 0 18px;letter-spacing:.04em}
section{margin-top:30px}
.label{font-size:12px;letter-spacing:.22em;color:var(--ink-3);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* 인물 */
.who{display:flex;gap:16px;align-items:center}
.who .name{font-size:22px;font-weight:700}
.who .sect{color:var(--ink-2);font-size:14px}
.realm{display:flex;align-items:baseline;gap:14px;margin-top:14px;flex-wrap:wrap}
.realm b{font-family:var(--f-brush);font-weight:400;font-size:46px;line-height:1;letter-spacing:.06em}
.realm span{font-size:18px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{position:relative;height:10px;margin-top:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:6px;transition:width .6s ease;
  -webkit-mask:linear-gradient(90deg,#000 80%,rgba(0,0,0,.55));mask:linear-gradient(90deg,#000 80%,rgba(0,0,0,.55))}
.bar.seal-c i{background:var(--seal)}
.barnote{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}

.btn{border:1.5px solid var(--ink);background:transparent;padding:10px 18px;border-radius:2px;font-size:15px;letter-spacing:.06em;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--ink-2)}
.btn.sealb{border-color:var(--seal);color:var(--seal)}
.btn.sealb:hover{background:var(--seal);color:var(--paper)}
.btn.ghost{border-color:var(--line);color:var(--ink-2)}
.btn:disabled{opacity:.4;cursor:not-allowed;background:transparent;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.wall{margin-top:16px;padding:14px 16px;border-left:3px solid var(--seal);background:var(--seal-soft)}
.wall p{margin:0 0 10px}

/* 선택칩 */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.mail{border:1px solid var(--line);margin:8px 0;background:color-mix(in srgb,var(--paper) 70%,white)}
.mail.got{opacity:.75}
.mailh{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:12px 14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.mailh span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.mailb{padding:0 14px 14px;display:grid;gap:10px}
.mailb p{margin:0;line-height:1.7}
.mailf{display:grid;gap:10px}
.mailf label{display:grid;gap:4px;font-size:12px;color:var(--ink-3);letter-spacing:.08em}
.mailf input,.mailf textarea{font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:2px}
.mailg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mailg input[type=number]{width:100%;min-width:0;box-sizing:border-box}
.mailf label.chk input{width:auto;margin:0}
.alarm{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.alarm p{margin:0;line-height:1.6}
.alarm .aic{flex:none;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);font-family:var(--f-brush);font-size:17px;color:var(--ink-2);border-radius:50%}
.alarm.new .aic{border-color:var(--seal);color:var(--seal)}
.ttl{font-size:.62em;color:var(--seal);letter-spacing:.04em;margin-right:4px;font-weight:normal;vertical-align:middle;white-space:nowrap}
.tgrp{margin:12px 0}.tgrp .kicker{display:block;margin-bottom:6px}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tt{display:grid;gap:2px;text-align:left;padding:9px 11px;border:1px solid var(--line);background:none;font:inherit;color:var(--ink);border-radius:2px;cursor:pointer}
.tt b{font-family:var(--f-brush);font-size:16px;font-weight:normal}.tt span{font-size:11px;color:var(--ink-3);line-height:1.4}
.tt.on{border-color:var(--seal)}.tt.on b{color:var(--seal)}
.tt.off{cursor:default;opacity:.55;border-style:dashed}
.diff{font-weight:bold}.diff.d0{color:#4f7a52}.diff.d1{color:var(--ink-2)}.diff.d2{color:var(--seal)}
.case.done{opacity:.6}
.notice .pin{font-size:11px;color:#fff;background:var(--seal);padding:1px 6px;border-radius:2px;margin-right:6px;vertical-align:2px;font-weight:normal}
.notice.new .mailh b::after{content:"새";font-size:10px;color:var(--seal);border:1px solid var(--seal);border-radius:2px;padding:0 4px;margin-left:6px;vertical-align:2px;font-weight:normal}
.notice .sig{text-align:right;font-family:var(--f-brush)}
.sectmv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:6px}
.smv{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border:1px solid var(--line);background:none;font:inherit;color:var(--ink);border-radius:2px;cursor:pointer}
.smv:hover:not([disabled]){border-color:var(--ink-3)}.smv[disabled]{opacity:.5;cursor:default}
.smv span{display:grid;gap:2px}.smv b{font-family:var(--f-brush);font-size:17px;font-weight:normal}.smv em{font-style:normal;font-size:12px;color:var(--ink-2)}.smv small{font-size:11px;color:var(--ink-3);line-height:1.45}.smv small.ban{color:var(--seal)}
.mailnew{display:block;width:100%;margin:10px 0 0;padding:9px 12px;border:1px solid var(--seal);color:var(--seal);background:none;font:inherit;font-size:14px;text-align:left;border-radius:2px;cursor:pointer}
.mailf label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);grid-column:1/-1}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:block;padding:8px 14px;border:1px solid var(--line);border-radius:2px;color:var(--ink-2);transition:all .2s;text-align:center}
.chip span em{display:block;font-style:normal;font-size:12px;color:var(--ink-3)}
.chip input:checked+span{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.kinds .chip span{min-width:120px}

.preview{margin:14px 0;font-size:14px;color:var(--ink-2)}
.preview b{color:var(--ink);font-variant-numeric:tabular-nums}

.train-now{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:104px;height:104px}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring text{fill:var(--ink);font-family:var(--f-body);font-size:15px;text-anchor:middle;dominant-baseline:middle}
.train-now h3{font-family:var(--f-brush);font-size:26px;line-height:1.1}
.train-now p{margin:4px 0;color:var(--ink-2);font-size:14px;font-variant-numeric:tabular-nums}

/* 능력치 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;gap:10px}
.stat{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .k em{display:block;font-family:var(--f-body);font-style:normal;font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:5px}
.stat .k em b{color:var(--seal);font-weight:400}
.stat .k{font-family:var(--f-brush);font-size:19px;line-height:1}
.stat .v{font-size:20px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--seal);margin-left:4px}
.pm{display:flex;gap:4px}
.pm button{width:30px;height:30px;border:1px solid var(--line);background:transparent;border-radius:2px}
.pm button:disabled{opacity:.3;cursor:not-allowed}
.points{font-size:14px;color:var(--ink-2);margin:4px 0 10px}
.points b{color:var(--seal);font-size:18px}
dl.derived{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:14px}
dl.derived dt{color:var(--ink-3)}
dl.derived dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}

.skills{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.skills li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.skills b{font-weight:700;white-space:nowrap}
.skills .tag{font-size:11px;letter-spacing:.1em;border:1px solid var(--line);padding:0 6px;color:var(--ink-3);white-space:nowrap}
.skills span:last-child{color:var(--ink-2)}

/* 동료 */
.mate{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.mate:last-child{border-bottom:0}
.mate .n{font-weight:700}
.mate .d{font-size:13px;color:var(--ink-2)}
.empty{font-size:14px;color:var(--ink-3);line-height:1.7}

.log{list-style:none;margin:0;padding:0;font-size:13px;color:var(--ink-2);display:grid;gap:6px}
.log time{color:var(--ink-3);font-variant-numeric:tabular-nums;margin-right:8px}

/* 입문 */
.intro p{color:var(--ink-2);max-width:56ch}
.field{display:grid;gap:6px;margin:18px 0}
.field input{font:inherit;font-size:18px;padding:10px 4px;border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:var(--ink);max-width:320px}
.sects{display:grid;grid-template-columns:1fr;gap:10px}
.sectc{position:relative;display:block;cursor:pointer}
.sectc input{position:absolute;opacity:0;pointer-events:none}
.sectc .box{position:relative;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:16px 18px;border:1px solid var(--line);transition:all .2s;align-items:start}
.sectc .box .seal{grid-row:1/span 3;width:46px;height:46px;font-size:15px;margin-top:2px}
.sectc .box h3{font-family:var(--f-brush);font-size:24px;line-height:1.15}
.sectc .box .role{font-size:12px;color:var(--ink-3);letter-spacing:.08em}
.sectc .box p{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.sectc .box .sk{font-size:12px;color:var(--ink-3)}
.sectc:hover .box{border-color:var(--ink-3)}
.sectc input:checked+.box::after{content:"선택함";position:absolute;right:16px;top:16px;font-size:12px;color:var(--seal);letter-spacing:.1em}
.sectc input:checked+.box{border-color:var(--ink);background:var(--paper-2)}

details.tools{margin-top:40px;font-size:13px;color:var(--ink-3)}
details.tools summary{cursor:pointer}
details.tools .row{margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:10px 18px;font-size:14px;opacity:0;transition:all .35s;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .6s ease both}
@keyframes fade{from{opacity:.0;filter:blur(3px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 2단계: 탭, 지도, 임무 */
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;padding:10px 14px;border:1px solid var(--line);background:var(--paper-2);font-size:14px}
.banner b{font-weight:700}
.banner .t{color:var(--ink-2);font-variant-numeric:tabular-nums}
.banner.done{border-color:var(--seal)}
.banner .btn{padding:6px 12px;font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:26px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:10px 14px;font-family:var(--f-brush);font-size:18px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;letter-spacing:.06em}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--seal);margin-left:6px;vertical-align:middle}
.mapbox{overflow-x:auto;margin-inline:-4px}
.map{display:block;width:100%;min-width:340px;height:auto}
.map .river{fill:none;stroke:var(--ink-3);stroke-width:1.2;opacity:.45}
.map .rname{fill:var(--ink-3);font-size:10px;font-family:var(--f-body);letter-spacing:.2em;opacity:.8}
.map .road{stroke:var(--ink-3);stroke-width:1.3;stroke-dasharray:1 5;stroke-linecap:round;opacity:.7}
.map .road.near{stroke:var(--ink);stroke-dasharray:none;opacity:.55}
.map .road.go{stroke:var(--seal);stroke-dasharray:none;opacity:.9;stroke-width:2}
.map .hrs{fill:var(--ink-2);font-size:10px;font-family:var(--f-body);paint-order:stroke;stroke:var(--paper);stroke-width:3px;text-anchor:middle}
.map .node{cursor:pointer}
.map .node:focus{outline:none}
.map .node .pt{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.map .node .hit{fill:transparent}
.map .node.sel .ring2{fill:none;stroke:var(--seal);stroke-width:1.5;stroke-dasharray:3 3}
.map .node:focus-visible .pt{stroke:var(--seal);stroke-width:3}
.map .node.lock .pt{stroke-dasharray:2 2}
.map .name{fill:var(--ink);font-family:var(--f-brush);font-size:15px;text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.map .here{fill:var(--seal-soft);stroke:var(--seal);stroke-width:1.5}
.map .heret{fill:var(--seal);font-family:var(--f-brush);font-size:9px;text-anchor:middle}
.map .mate{fill:var(--ink-2)}
.map .matet{fill:var(--ink-2);font-size:9px;font-family:var(--f-body);paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.region{margin-top:12px;display:grid;gap:6px}
.region h3{font-family:var(--f-brush);font-size:26px;line-height:1.1}
.region .place{color:var(--ink-3);font-size:13px;letter-spacing:.06em}
.region p{margin:0;color:var(--ink-2);font-size:14px}
.case{margin-top:8px;border:1px solid var(--line);background:var(--paper-2);padding:16px 18px}
.case .kicker{font-size:12px;letter-spacing:.2em;color:var(--seal)}
.case h3{font-family:var(--f-brush);font-size:24px;line-height:1.2;margin:4px 0 8px}
.case p{margin:0 0 10px;color:var(--ink-2);font-size:14px;max-width:60ch}
.case .q{color:var(--ink);font-size:15px;margin:14px 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;border:1px solid var(--line);background:var(--paper);padding:10px 14px;border-radius:2px;transition:border-color .2s}
.opt:hover{border-color:var(--ink)}
.opt b{font-family:var(--f-brush);font-weight:400;font-size:16px;white-space:nowrap}
.opt span{color:var(--ink-2);font-size:14px}
.opt small{margin-left:auto;color:var(--ink-3);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rolls{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}

const hrsFor=(h,x)=>h?.horse?Math.round(x*(1-HORSE_CUT)*60)/60:x;

const roadHours=(a,b)=>{const r=ROADS.find(r=>(r[0]===a&&r[1]===b)||(r[0]===b&&r[1]===a));return r?r[2]:0};
function route(a,b){ // 가장 빠른 길 (다익스트라)
  const dist={},prev={},q=new Set(Object.keys(REGIONS));for(const k of q)dist[k]=Infinity;dist[a]=0;
  while(q.size){let u=null;for(const k of q)if(u===null||dist[k]<dist[u])u=k;q.delete(u);if(u===b)break;
    for(const r of ROADS){const v=r[0]===u?r[1]:r[1]===u?r[0]:null;if(v&&q.has(v)&&dist[u]+r[2]<dist[v]){dist[v]=dist[u]+r[2];prev[v]=u}}}
  const path=[b];while(path[0]!==a&&prev[path[0]])path.unshift(prev[path[0]]);return {path,hours:dist[b]};
}

  case "sorim": { // 법륜: 여덟 살의 수레바퀴
    let sp="",kn="";for(let i=0;i<8;i++){const a=i*Math.PI/4,x1=c+Math.cos(a)*5,y1=cy+Math.sin(a)*5,x2=c+Math.cos(a)*14,y2=cy+Math.sin(a)*14,x3=c+Math.cos(a+Math.PI/8)*19,y3=cy+Math.sin(a+Math.PI/8)*19;
      sp+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;kn+=`<circle cx="${x3.toFixed(1)}" cy="${y3.toFixed(1)}" r="1.9" fill="currentColor" stroke="none"/>`}
    return `<g stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"><circle cx="32" cy="32" r="14.5"/>${sp}<circle cx="32" cy="32" r="4" fill="currentColor"/></g>${kn}`;}
  case "hwasan": { // 매화 다섯 잎
    let pe="",st="";for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5,x=c+Math.cos(a)*8.5,y=cy+Math.sin(a)*8.5;pe+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7.6"/>`;
      const b=a+Math.PI/5,sx=c+Math.cos(b)*6,sy=cy+Math.sin(b)*6;st+=`<line x1="32" y1="32" x2="${sx.toFixed(1)}" y2="${sy.toFixed(1)}"/><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="1.1" fill="var(--ink)" stroke="none"/>`}
    return `<g fill="currentColor">${pe}</g><circle cx="32" cy="32" r="4.2" fill="var(--paper)"/><g stroke="var(--ink)" stroke-width=".8">${st}</g><circle cx="32" cy="32" r="1.6" fill="currentColor"/>`;}
  case "ami": { // 연꽃과 눈썹달
    const pet=`M32 46 C24.5 38 25 28 32 21 C39 28 39.5 38 32 46Z`;
    return `<g fill="currentColor"><path d="${pet}" transform="rotate(-42 32 46)" opacity=".55"/><path d="${pet}" transform="rotate(42 32 46)" opacity=".55"/><path d="${pet}" transform="rotate(-20 32 46)" opacity=".8"/><path d="${pet}" transform="rotate(20 32 46)" opacity=".8"/><path d="${pet}"/></g>
      <path d="M22 48 Q32 52 42 48" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M27.5 14.5 A6 6 0 1 0 38 11 A4.6 4.6 0 1 1 27.5 14.5Z" fill="currentColor"/>`;}
  case "mudang": { // 태극과 팔괘
    let bars="";for(let i=0;i<8;i++){const a=i*45;bars+=`<g transform="rotate(${a} 32 32)"><line x1="27.5" y1="13" x2="36.5" y2="13"/>${i%2?`<line x1="27.5" y1="10" x2="30.8" y2="10"/><line x1="33.2" y1="10" x2="36.5" y2="10"/>`:`<line x1="27.5" y1="10" x2="36.5" y2="10"/>`}</g>`}
    return `<g stroke="currentColor" stroke-width="1.7" stroke-linecap="round">${bars}</g><circle cx="32" cy="32" r="12" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/>
      <path d="M32 20 A12 12 0 0 1 32 44 A6 6 0 0 1 32 32 A6 6 0 0 0 32 20Z" fill="currentColor"/><circle cx="32" cy="26" r="1.9" fill="currentColor"/><circle cx="32" cy="38" r="1.9" fill="var(--paper)"/>`;}
  case "namgung": { // 하늘을 꿰뚫는 창과 창궁(蒼穹)
    let ray="";for(let i=0;i<8;i++){const a=i*45;ray+=`<line x1="32" y1="14" x2="32" y2="17" transform="rotate(${a} 32 32)"/>`}
    return `<g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"><circle cx="32" cy="32" r="11.5"/>${ray}</g>
      <g transform="rotate(-35 32 32)"><rect x="31" y="16" width="2" height="38" rx="1" fill="currentColor"/><path d="M32 6 L35.4 13.5 L32 18 L28.6 13.5Z" fill="currentColor"/>
      <path d="M29 18.5 Q32 21.5 35 18.5 L34 24 Q32 22.5 30 24Z" fill="currentColor" opacity=".75"/></g>`;}
  case "kunlun": { // 눈 덮인 세 봉우리와 구름
    return `<path d="M10 44 L22 26 L28 34 L34 20 L46 40 L50 36 L56 44Z" fill="currentColor"/>

  case "jegal": { // 깃털 부채와 팔괘 한 줄
    let fe="";for(let i=0;i<7;i++){const a=-60+i*20;fe+=`<path d="M32 38 L32 21.5" transform="rotate(${a} 32 40)"/>`}

  }})();
  return `<svg class="emb ${cls}" viewBox="0 0 64 64" style="color:var(--c-${k})" role="img" aria-label="${SECTS[k]?.n||""} 문양">
    <circle cx="32" cy="32" r="30" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="1.8"/><circle cx="32" cy="32" r="26.5" fill="none" stroke="currentColor" stroke-width=".7" stroke-opacity=".6"/>${P}</svg>`;
}

/* ───────── 일지: 지금 탐문과 지난 사건을 넓게 읽기 ───────── */
let readerOpen=null; // null | "live" | 지난 일지 번호
function tagText(e){
  if(e.kind==="find") return `【획득 · ${ITEMS[e.item][0]}】`;
  if(e.kind==="fight") return `【전투 발생】【${e.ok?"승리":"패배"}${e.stone?" · 강화석":""}】`;
  return `【${STATS[e.stat].n} 판정 ${e.ok?"성공":"실패"}】`;
}
const toLine=e=>e.kind==="amb"||e.kind==="comp"?{t:e.t,k:e.kind,x:e.text}:{t:e.t,k:"ev",x:e.text,g:tagText(e),f:!e.ok,r:e.res};
function missionLines(h,m,upto){
  const inc=INC[m.region][m.idx],out=feedFor(h,m,companionFor(m)).filter(e=>e.t<=Math.min(upto,m.end)).map(toLine);
  if(m.phase==="scene"){
    out.push({t:m.end,k:"sec",x:"현장"});
    m.rolls.forEach(r=>out.push({t:r.t||m.end,k:"ev",x:`${inc.s[r.step].q} ${STATS[r.stat].n}의 길을 택했다. ${r.txt}.`,g:`【${STATS[r.stat].n} 판정 ${r.ok?"성공":"실패"} · ${r.roll}+${r.bonus}/${r.dc}】`,f:!r.ok,r:r.ok?"단서를 찾았다.":"허탕을 쳤다."}));
    if(m.fight){const f=m.fight;out.push({t:f.t||m.end,k:"ev",x:`${inc.f}와 마주쳤다.`,g:"【전투 발생】",r:""});
      f.log.forEach(l=>out.push({t:f.t||m.end,k:"amb",x:l.replace(/<[^>]+>/g,"")}));
      out.push({t:f.t||m.end,k:"ev",x:f.res==="win"?`${inc.f}를 쓰러뜨렸다.`:f.res==="lose"?"쓰러졌다. 겨우 몸을 피했다.":`${inc.f}가 달아났다.`,g:f.res==="win"?"【승리】":f.res==="lose"?"【패배】":"【놓침】",f:f.res!=="win",r:""})}
  }
  return out;
}
function lineHTML(l,isNew){
  const tm=new Date(l.t),stamp=`${String(tm.getHours()).padStart(2,"0")}:${String(tm.getMinutes()).padStart(2,"0")}`;
  const body=esc(l.x).replace(/\u0001(.*?)\u0002/g,"<b>$1</b>");
  if(l.k==="sec") return `<li class="sec"><span class="tm"></span><span class="body">— ${body} —</span></li>`;
  if(l.k==="end") return `<li class="endl"><span class="tm">${stamp}</span><span class="body">${body}</span></li>`;
  if(l.k==="ev2") return `<li class="ev b-${l.sub}"><span class="tm"></span><span class="body">${body}</span></li>`;
  if(l.k==="amb"||l.k==="comp") return `<li class="${l.k}${isNew?" new":""}"><span class="tm">${stamp}</span><span class="body">${body}</span></li>`;
  return `<li class="ev${isNew?" new":""}"><span class="tm">${stamp}</span><span class="body"><span class="txt">${body}</span> <span class="tag ${l.f?"fail":""}">${l.g||""}</span>${l.r?`<span class="res">${esc(l.r)}</span>`:""}</span></li>`;
}
function saveJournal(h,m,inc,tier,rewardText){
  const lines=missionLines(h,m,m.end).map(l=>({...l}));
  lines.push({t:Date.now(),k:"sec",x:`결말 · ${TIER[tier]}`},{t:Date.now(),k:"end",x:inc.e[tier]},{t:Date.now(),k:"amb",x:rewardText});
  h.journal=[{title:inc.t,region:m.region,start:m.start,tier,comp:companionsFor(m).map(c=>c.name).join(", ")||null,lines},...(h.journal||[])].slice(0,10);
}
function readerHTML(){
  const h=me;if(!h||readerOpen===null)return "";
  let title,sub,lines,live=false,ready=false;
  if(readerOpen==="live"){const m=h.mission;if(!m){readerOpen=null;return ""}
    const inc=INC[m.region][m.idx];live=true;ready=Date.now()>=m.end;title=inc.t;sub=`${REGIONS[m.region].n} · ${hhmm(m.start)} 시작${companionsFor(m).length?` · 동행 ${esc(companionsFor(m).map(c=>c.name).join(", "))}`:""}`;
    lines=missionLines(h,m,Date.now())}
  else{const j=h.journal?.[readerOpen];if(!j){readerOpen=null;return ""}
    title=j.title;sub=`${REGIONS[j.region].n} · ${hhmm(j.start)} · ${j.label||TIER[j.tier]}${j.comp?` · 동행 ${esc(j.comp)}`:""}`;lines=j.lines}
  const list=(h.journal||[]).map((j,i)=>`<button type="button" class="jl ${readerOpen===i?"on":""}" data-read="${i}">${hhmm(j.start)} · ${esc(j.title)} <span>${j.label||TIER[j.tier]}</span></button>`).join("");
  return `<div class="rhead"><div><div class="kicker">${live?"탐문 일지 · 진행 중":"지난 일지"}</div><h2>${esc(title)}</h2><div class="note" style="margin:0">${sub}</div></div>
      <button class="btn ghost" type="button" id="readerClose">닫기</button></div>
    ${list||h.mission?`<div class="jlist">${h.mission?`<button type="button" class="jl ${live?"on":""}" data-read="live">지금 사건 <span>진행 중</span></button>`:""}${list}</div>`:""}
    <div class="rbody" id="rbody"><ul class="feed big" data-key="r${readerOpen}-${lines.length}">${lines.map((l,i)=>lineHTML(l,live&&i===lines.length-1)).join("")}
      ${live&&!ready?`<li class="wait"><span class="tm"></span><span class="body">계속 탐문하는 중… <span data-until="${h.mission.end}"></span> 남음</span></li>`:""}</ul></div>`;
}
function renderReader(){
  const el=$("#reader"),body=$("#rbody"),atB=!body||body.scrollHeight-body.scrollTop-body.clientHeight<40,st=body?.scrollTop||0,was=!el.hidden;
  const html=readerHTML();
  if(!html){el.hidden=true;el.innerHTML="";document.body.style.overflow="";return}
  el.innerHTML=html;el.hidden=false;document.body.style.overflow="hidden";
  const nb=$("#rbody");if(nb)nb.scrollTop=(!was||atB)?nb.scrollHeight:st;
  $("#readerClose").addEventListener("click",()=>{readerOpen=null;renderReader();$("#readerBtn")?.focus()});
  el.querySelectorAll("[data-read]").forEach(b=>b.addEventListener("click",()=>{readerOpen=b.dataset.read==="live"?"live":+b.dataset.read;$("#reader").hidden=true;renderReader()}));
  if(!was)$("#readerClose").focus();
}
addEventListener("keydown",e=>{if(e.key==="Escape"&&readerOpen!==null){readerOpen=null;renderReader()}});
function journalList(){
  const j=me.journal||[];if(!j.length)return "";
  return `<div class="label" style="margin-top:22px">지난 일지</div><div class="jrows">${j.map((x,i)=>`<button type="button" class="jrow" data-read="${i}"><span class="tm">${hhmm(x.start)}</span><span>${esc(x.title)}<em> · ${REGIONS[x.region].n}</em></span><b>${x.label||TIER[x.tier]}</b></button>`).join("")}</div>`;
}

function setMode(m){const h=structuredClone(me);if(!h.lair?.boss)return;h.lair.boss.mode=m;save(h)}
function autoLoop(){
  clearTimeout(autoLoop.t);
  if(me?.lair?.phase==="boss"&&me.lair.boss.mode==="auto")autoLoop.t=setTimeout(()=>{if(me?.lair?.phase==="boss"&&me.lair.boss.mode==="auto")bossTurn(autoAction())},1300);
}
function lairView(){
  const h=me,run=h.lair,B=bossFor(run.period),party=lairParty(h,run);
  const bars=`<div class="lparty">${party.map(x=>`<div class="lp ${x.hp<=0?"dead":""}">${x.isMe?face(myId(),x.sect,"sm"):emblem(x.sect,"sm")}<div><b>${esc(x.name)}${x.isMe?" (나)":""}</b><span>${ROLE_N[x.role]} · ${x.hp}/${x.max}</span><div class="hpb"><i style="width:${x.hp/x.max*100}%"></i></div></div></div>`).join("")}</div>`;
  const mods=run.mods.length?`<div class="mods">${run.mods.map(m=>`<span class="${MODS[m.k].good?"good":"bad"}">${MODS[m.k].t}</span>`).join("")}</div>`:`<p class="note" style="margin:0">아직 보스 상태에 변화가 없다. 무기고, 부두목, 감옥, 보스의 거처에서 한 일이 보스를 바꾼다.</p>`;

  const feed=`<div class="feedwrap" style="margin:14px -18px 0"><ul class="feed" id="lairFeed">${run.log.map(battleLine).join("")}</ul></div>`;
  let ctl="";

    ctl=`<p class="q">갈림길 ${run.step}/4. 어느 쪽으로 갈까?</p><div class="opts">${fk.map((f,i)=>`<button class="opt" type="button" data-fork="${i}"><b>${f.label}</b><span>${f.hint}</span></button>`).join("")}</div>

      ${retreatConfirm?`<button class="btn sm sealb" type="button" id="retYes">정말 돌아간다</button><button class="btn sm ghost" type="button" id="retNo">계속 간다</button>`:`<button class="btn sm ghost" type="button" id="retBtn">여기서 돌아가기</button>`}</div>`}
  else if(run.phase==="room"){const R=ROOMS[run.room.t];
    ctl=`<p class="q">${R.name}. ${R.text}</p><div class="opts">${(()=>{const dc=dcFor(h.realm),bm=bestOf(R.opts.map(o=>o[1]),0,dc),multi=R.opts.filter(o=>o[1]).length>1;return R.opts.map(([k,st,txt])=>{if(!st)return `<button class="opt" type="button" data-ro="${k}"><b>행동</b><span>${txt}</span><small>판정 없음</small></button>`;
  const c=optCheck(st,0,dc,false),best=multi&&c.c===bm,c2=optCheck(st,0,dc,best);return `<button class="opt" type="button" data-ro="${k}">${c2.b}<span>${txt}</span>${c2.s}</button>`}).join("")})()}</div>`}
  else if(run.phase==="boss"){const b=run.boss,auto=b.mode==="auto";

function chanceOf(bonus,dc){let n=0;for(let r=1;r<=20;r++)if(r===20||(r!==1&&r+bonus>=dc))n++;return n*5}
function optCheck(stat,extra,dc,best){const v=me.stats[stat],b=Math.floor(v/10)+(extra||0),c=chanceOf(b,dc);
  return {b:`<b>${STATS[stat].n} <em class="sv">${v}</em></b>`,s:`<small title="주사위 D20+${b}, 목표 ${dc} 이상"><span class="pc ${best?"best":""}">성공 ${c}%</span>${best?" · 유리":""}<br>D20+${b} ≥ ${dc}</small>`,c}}
function bestOf(stats,extra,dc){let m=-1;stats.forEach(st=>{if(st){const c=chanceOf(Math.floor(me.stats[st]/10)+(extra||0),dc);if(c>m)m=c}});return m}

/* ───────── 인연 · 선물 · 동행 · 문파 우호도 · 직위 ─────────
   각자 자기 기록에만 쓴다. 두 사람의 인연도 = 내가 쌓은 몫 + 상대가 쌓은 몫.

const BOND_STAGES=[[0,"지인"],[100,"친분"],[300,"각별"],[600,"깊은 인연"]];
const REL_FX={사제:"함께한 사건·소굴에서 제자 경험치 +25%, 스승은 강화석 +1",친우:"같이 임무하면 보상 +20%",사형제:"관문에서 도울 때 공격·방어 +15%",연인:"서로에게 쓰는 회복 +25%"};
const COMBO={사제:"사도전승",친우:"의기투합",사형제:"사문합벽",연인:"비익연리"};
const GIFT_VAL={herb:5,wine:10,trinket:20};
const FAVOR_STAGES=[[0,"냉담",0],[200,"우호",.1],[500,"신뢰",.2],[1000,"동지",.25]];
const REGION_SECTS={henan:["sorim"],shaanxi:["hwasan"],hubei:["mudang","jegal"],sichuan:["ami","dang"],jiangnan:["namgung"],xiyu:["kunlun"]};
const SECT_GIFT={herb:10,wine:15,trinket:25};
let giftPick={}, relPick={}, sectPick=null, sectConfirm=false;
const bondOf=(a,b)=>heroById(a)?.bonds?.[b]||{};
const bondTotal=(a,b)=>(bondOf(a,b).pts||0)+(bondOf(b,a).pts||0);
const stageOf=p=>{let s=BOND_STAGES[0];for(const x of BOND_STAGES)if(p>=x[0])s=x;return s};
/* 사제: 한쪽은 "스승"(제자로 받겠다), 다른 쪽은 "제자"(사부로 모시겠다)를 골라야 맺어진다 */
const PAIR={스승:"제자",제자:"스승"};
const relMatch=(a,b)=>!!a&&a!=="지인"&&(PAIR[a]?PAIR[a]===b:a===b);
const relNorm=w=>PAIR[w]?"사제":w;
const wantTxt=w=>w==="스승"?"제자로 받겠다고":w==="제자"?"사부로 모시겠다고":`${w}의 연을 맺자고`;
/* a 쪽에서 본, 지금 성립한 관계 값 (사제면 "스승"/"제자") */
function relRaw(a,b){const A=bondOf(a,b),B=bondOf(b,a);
  if(A.want==="지인"||B.want==="지인")return null;
  if(relMatch(A.want,B.want))return A.want;
  if(relMatch(A.agreed,B.agreed))return A.agreed;
  if(relMatch(A.agreed,B.want))return A.agreed;
  if(relMatch(A.want,B.agreed))return A.want;return null}
function relMutual(a,b){const r=relRaw(a,b);return r?relNorm(r):"지인"}
/* 사제일 때 a가 스승이면 "스승", 제자면 "제자" */
function sajeRole(a,b){const r=relRaw(a,b);return PAIR[r]?r:null}
/* 내 쪽에서 본 관계 이름: 사제면 상대가 "사부"인지 "제자"인지 */
/* 말하는 쪽(a) 기준 관계: 사제면 a가 스승일 때 "사부", 제자일 때 "제자" */
function relDir(a,b){const r=relMutual(a,b);if(r!=="사제")return r;return sajeRole(a,b)==="스승"?"사부":"제자"}

/* 무리(동행): 무리장 h.party=자기 번호, h.partyInv=[부른 사람]. 무리원 h.party=무리장 번호. 최대 4명. 각자 자기 기록만 고친다. */

  const inv=L.partyInv||[],ms=allHeroes().filter(o=>o!==L&&(o._id||(o===me&&myId()))&&o.party===leaderId&&inv.includes(o===me?myId():o._id)).map(o=>o===me?myId():o._id);
  return [leaderId,...ms.sort((a,b)=>(heroById(a)?.partyT||0)-(heroById(b)?.partyT||0)).slice(0,PARTY_MAX-1)]}

/* ───────── 알림: 무리에게 "같이 가자 / 토벌 가자 / 관문 도와줘" 부르기 + 모든 소식 모아 보기 ─────────
   부르기는 보내는 사람 자기 기록 h.calls 에만 남긴다. 받는 사람은 남의 기록을 읽어 알림으로 만든다. */
const CALL_TTL=3*3600e3, CALL_N={go:"같이 가자",raid:"토벌 가자",gate:"관문 도움 요청"};
function sendCall(k,data,toAll){
  const h=structuredClone(me),now=Date.now(),mates=realMates().map(o=>o._id);
  const to=toAll?["*"]:mates;if(!to.length){toast("같은 무리에 사람이 있어야 합니다.");return}
  const last=(h.calls||[]).find(c=>c.k===k&&now-c.t<60e3);if(last){toast("방금 불렀어요. 1분 뒤에 다시 부를 수 있어요.");return}
  h.calls=[{id:now.toString(36),k,to,t:now,...data},...(h.calls||[]).filter(c=>now-c.t<CALL_TTL)].slice(0,8);
  addLog(h,`${toAll?"강호에":"무리에게"} ${CALL_N[k]}고 알렸다.`);save(h);toast(`${toAll?"모두":"무리"}에게 알렸습니다.`);
}
function alarmsForMe(){
  if(!me)return [];const now=Date.now(),out=[],me_=myId();
  for(const o of others){if(!o._id||String(o._id).startsWith("fake-"))continue;
    for(const c of o.calls||[]){if(now-c.t>CALL_TTL||!(c.to||[]).some(x=>x===me_||x==="*"))continue;
      if(c.k==="go"){const R=REGIONS[c.reg];if(!R||me.loc===c.reg)continue;
        out.push({key:"c"+o._id+c.id,t:c.t,who:o._id,icon:"行",text:`${josa(esc(o.name),"이")} <b>${R.n}</b>로 같이 가자고 한다.`,btn:[["함께 떠난다",`data-ago="${c.reg}" data-awith="${o._id}"`]]})}
      if(c.k==="raid"){const R=REGIONS[c.reg];out.push({key:"c"+o._id+c.id,t:c.t,who:o._id,icon:"討",text:`${josa(esc(o.name),"이")} ${R?`<b>${R.n}</b>의 `:""}<b>${esc(c.boss||"보스")}</b> 토벌을 같이 가자고 한다.`,btn:[["토벌 탭 보기",`data-atab="raid"`]]})}
      if(c.k==="gate"){const r=gateRooms[c.room];if(!r||r.status!=="lobby")continue;const G=GATES[r.realm];
        out.push({key:"c"+o._id+c.id,t:c.t,who:o._id,icon:"關",text:`${josa(esc(o.name),"이")} <b>${G.title}</b>(${REGIONS[G.region].n} · ${G.boss})에 도우미를 청한다.`,btn:[["도우미로 합류",`data-join="${c.room}"`],["관문 탭 보기",`data-atab="gate"`]]})}}}
  for(const r of coInvitesForMe()){const L=heroById(r.members[0]);out.push({key:"l"+r.id,t:r.start,who:r.members[0],icon:"窟",text:`${josa(esc(L?.name||"무리"),"이")} <b>${bossFor(r.period).n}의 소굴</b> 어귀에서 기다린다.`,btn:[["소굴에 들어간다",`data-cojoin="${r.id}"`]]})}
  for(const d of duelInvitesForMe())out.push({key:"d"+d.id,t:d.t,who:d.a,icon:"劍",text:`${josa(esc(d.an),"이")} <b>논검비무</b>를 청했다.`,btn:[["받는다",`data-duelok="${d.id}"`],["사양한다",`data-duelno="${d.id}"`]]});
  for(const o of partyCallsForMe())out.push({key:"p"+o._id+(o.partyT||0),t:o.partyT||0,who:o._id,icon:"伴",text:`${josa(esc(o.name),"이")} 무리로 불렀다.`,btn:[["무리에 들어간다",`data-pjoin="${o._id}"`]]});
  for(const n of noticeList())if(n.t>(me.noticeSeen||0))out.push({key:"n"+n.id,t:n.t,icon:"榜",text:`[${NOTICE_BY}] 공지 <b>「${esc(n.title)}」</b>`,btn:[["공지 보기",`data-atab="notice"`]]});
  for(const m of myMails())if(!mailGot(m.id)&&(hasGifts(m)||!(me.mailSeen>=m.t)))out.push({key:"m"+m.id,t:m.t,icon:"信",text:`우편 <b>「${esc(m.title)}」</b>${hasGifts(m)?" · 보상이 들어 있다":""}`,btn:[["우편함 열기",`data-atab="mail"`]]});
  for(const o of others){if(!o._id)continue;const B=bondOf(o._id,myId()),A=bondOf(myId(),o._id);
    if(B.want&&B.want!=="지인"&&!relMatch(B.want,A.want)&&relNorm(B.want)!==relMutual(myId(),o._id))out.push({key:"r"+o._id+B.want,t:B.wantT||0,who:o._id,icon:"緣",text:`${josa(esc(o.name),"이")} ${B.want==="스승"?"나를 <b>제자로 받겠다고</b> 한다.":B.want==="제자"?"나를 <b>사부로 모시겠다고</b> 한다.":`<b>${B.want}</b>의 연을 청했다.`}`,btn:[["인연 탭 보기",`data-atab="mates"`]]})}
  for(const g of giftsToMe().slice(0,5))out.push({key:"g"+g.fromId+g.id,t:g.t,who:g.fromId,icon:"禮",text:`${josa(esc(g.from),"이")} ${josa(ITEMS[g.item][0],"을")} 보냈다.`,btn:[]});
  return out.sort((a,b)=>b.t-a.t);
}

/* 새 알림이 생기면 화면에 띄우고, 창이 뒤에 있으면 기기 알림도 보낸다 */
let alarmKnown=null;
function checkAlarms(){
  if(!me||mode!=="db"||!ready)return;const list=alarmsForMe();
  if(alarmKnown===null){alarmKnown=new Set(list.map(a=>a.key));return}
  const fresh=list.filter(a=>!alarmKnown.has(a.key)&&Date.now()-a.t<10*60e3);list.forEach(a=>alarmKnown.add(a.key));
  if(!fresh.length)return;const plain=fresh[0].text.replace(/<[^>]+>/g,"");
  toast(`알림 · ${plain}`);
  try{if("Notification" in window&&Notification.permission==="granted"&&document.hidden)new Notification("무림행",{body:plain+(fresh.length>1?` 외 ${fresh.length-1}건`:""),tag:"murim-"+fresh[0].key})}catch(e){}
}

/* ───────── 프로필 사진: 128×128로 줄여 avatars/내 번호 에 글자로 저장 ───────── */

    const S=128,c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d"),m=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);URL.revokeObjectURL(url);
    let d=c.toDataURL("image/webp",.82);if(!d.startsWith("data:image/webp"))d=c.toDataURL("image/jpeg",.82);if(d.length>45000)d=c.toDataURL("image/jpeg",.6);

/* ───────── 동행 소굴: 동행 둘이 한 소굴에 함께 들어간다 ─────────
   판은 lairs/<번호> 하나를 함께 쓴다. 갈림길과 방은 먼저 누른 사람이 고른다(잠금으로 한 명만 통과).
   보스방은 관문처럼 각자 고르고, 둘 다 고르거나 60초가 지나면 진행한다. */
const CO_WAIT=60e3;
let lairRuns={}, coBusy=false, coRetreat=false;
const myRun=()=>me?.colair?lairRuns[me.colair]||null:null;
const LS={
  async set(id,data){data.updated=Date.now();lairRuns[id]=structuredClone(data);
    if(mode==="db"){try{await db.doc("lairs/"+id).set(JSON.parse(JSON.stringify(data)))}catch(e){toast("소굴 기록에 실패했어요. 다시 시도해 주세요.")}}
    else setTimeout(render,0)},
  async get(id){if(mode==="db"){const s=await db.doc("lairs/"+id).get();return s.exists?structuredClone(s.data()):null}return structuredClone(lairRuns[id]||null)},
  async lease(id){if(mode!=="db")return true;try{return (await db.doc("lairs/"+id).acquire({holder:uid,ttlMs:5000})).acquired}catch(e){return false}}};
/* 먼저 잠금을 얻은 사람만 판을 바꾼다. check: 최신 판이 아직 그 상태인지, fn: 바꾸기 */
async function coEdit(check,fn){
  const r=myRun();if(!r||coBusy)return false;coBusy=true;
  try{if(!(await LS.lease(r.id))){toast("동행이 먼저 골랐어요.");return false}
    const fresh=await LS.get(r.id);if(!fresh||!check(fresh)){toast("동행이 먼저 골랐어요.");return false}
    const ok=fn(fresh);if(ok===false)return false;await LS.set(r.id,fresh);return true}
  finally{setTimeout(()=>coBusy=false,300)}
}
const realMates=()=>partyMates().filter(o=>o._id&&!String(o._id).startsWith("fake-"));
const mutualMate=()=>realMates()[0];
function coParty(run){
  run.members=[...new Set(run.members)];
  const ps=run.members.map(id=>{const h=heroById(id);if(!h)return null;const d=derived(h),role=run.roles?.[id]||SECT_ROLES[h.sect][0];
    return {id,name:h.name,sect:h.sect,role,hp:d.hp,max:d.hp,atk:d.atk,def:d.def,eva:d.eva,crit:d.crit,isMe:id===myId(),player:true,realm:h.realm}}).filter(Boolean);
  const need=["tank","dps","dps","heal"];ps.forEach(p=>{const i=need.indexOf(p.role);if(i>=0)need.splice(i,1);else need.pop()});
  const top=ps.reduce((a,p)=>Math.max(a,p.realm),0),tier=npcTier(top),mul=[.8,.9,1,1.1][tier],ref=ps.reduce((a,p)=>p.atk>a.atk?p:a,ps[0]),lead=heroById(run.members[0]),used={};
  const npcs=ref?need.slice(0,4-ps.length).map(r=>{const opts=NPC_SECT[r],k=used[r]?opts[(opts.indexOf(used[r])+1)%opts.length]:opts[0];used[r]=k;const fm=mul*(1+favorStage(favorOf(lead,k))[2]);
    return {id:k+r,name:NPCS[k][tier],role:r,sect:k,hp:Math.round(ref.max*fm),max:Math.round(ref.max*fm),atk:Math.round(ref.atk*fm),def:Math.round(ref.def*fm),eva:5,crit:5}}):[];
  const all=[...ps,...npcs].sort((a,b)=>["tank","dps","heal"].indexOf(a.role)-["tank","dps","heal"].indexOf(b.role));
  all.forEach(x=>{if(run.hp[x.id]!==undefined)x.hp=Math.min(x.max,run.hp[x.id])});return all;
}
function coCheckReady(){
  const p=periodNow(),B=bossFor(p),h=me,st=raidState(p),tries=h.raid?.period===p&&h.raid.tries.day===dayKey()?h.raid.tries.n:0;
  if(activity(h))return `${busyText[activity(h)]} 들어갈 수 없다.`;
  if(h.loc!==B.region)return `${REGIONS[B.region].n}에 있어야 한다.`;
  if(st.down)return "이미 토벌된 보스다.";
  if(tries>=3)return "오늘은 다 들어갔다.";
  return null;
}
function takeTry(h,role){const p=periodNow(),B=bossFor(p);
  if(!h.raid||h.raid.period!==p)h.raid={period:p,dmg:0,share:hpShareFor(h,role,B),tries:{day:dayKey(),n:0},claimed:false};
  if(h.raid.tries.day!==dayKey())h.raid.tries={day:dayKey(),n:0};h.raid.tries.n++}
function coInvite(){
  const open=partyOpenRun();if(open){toast(`${josa(heroById(open.members[0])?.name||"무리",open.status==="invite"?"이":"이")} ${open.status==="invite"?"이미 소굴 초대를 보냈어요. 그 초대로 들어가 주세요.":"이미 소굴 안에 있어요."}`);return}
  const mates=realMates(),mate=mates[0],why=coCheckReady();if(!mate){toast("같은 무리에 사람이 있어야 합니다.");return}if(why){toast(why);return}
  const p=periodNow(),B=bossFor(p),id=myId().replace(/[^A-Za-z0-9_-]/g,"")+"-"+Date.now().toString(36),role=raidRole&&SECT_ROLES[me.sect].includes(raidRole)?raidRole:SECT_ROLES[me.sect][0];
  const h=structuredClone(me);takeTry(h,role);h.colair=id;
  LS.set(id,{id,coop:true,period:p,status:"invite",invitees:mates.map(o=>o._id),members:[myId()],roles:{[myId()]:role},seed:Date.now()%2147483647,start:Date.now(),step:1,phase:"fork",hp:{},mods:[],path:[],
    loot:{exp:0,stone:0,herb:0,items:[]},room:null,boss:null,log:[{k:"sec",x:`${B.n}의 소굴`},{k:"amb",x:`${josa(h.name,"이")} 무리를 이끌고 ${B.title} ${B.n}의 소굴 어귀에 섰다.`}]});
  addLog(h,`무리에게 ${B.n}의 소굴에 함께 들어가자고 했다.`);save(h);

/* 무리 중 누가 이미 연 소굴(초대 중이거나 진행 중) */
function partyOpenRun(){const p=myParty();if(!p.length)return null;
  return Object.values(lairRuns).find(r=>r.coop&&(r.status==="invite"||r.status==="active")&&r.period===periodNow()&&Date.now()-(r.updated||0)<30*60e3&&r.members.some(id=>id!==myId()&&p.includes(id)))||null}
function coInvitesForMe(){return Object.values(lairRuns).filter(r=>r.status==="invite"&&(r.invitees||[r.invitee]).includes(myId())&&!r.members.includes(myId())&&r.period===periodNow()&&Date.now()-(r.updated||0)<30*60e3)}
let coJoining=false;
async function coJoin(id){
  if(coJoining)return;
  const why=coCheckReady();if(why){toast(why);return}
  coJoining=true;try{await coJoinCore(id)}finally{setTimeout(()=>coJoining=false,800)}}
async function coJoinCore(id){
  const role=raidRole&&SECT_ROLES[me.sect].includes(raidRole)?raidRole:SECT_ROLES[me.sect][0];
  if(mode==="db"&&!(await LS.lease(id))){toast("잠시 뒤 다시 눌러 주세요.");return}
  const fresh=await LS.get(id);if(!fresh||fresh.status==="closed"||fresh.status==="done"){toast("이미 닫힌 초대예요.");return}

  if(fresh.status!=="invite"){toast("이미 출발한 소굴이에요.");return}
  if(fresh.members.length>=PARTY_MAX){toast("자리가 다 찼어요.");return}

  if(fresh.members.length>=Math.min(PARTY_MAX,1+(fresh.invitees||[1]).length))coGo(fresh);
  const h=structuredClone(me);takeTry(h,role);h.colair=id;addLog(h,`${josa(heroById(fresh.members[0])?.name||"동행","과")} 함께 ${bossFor(fresh.period).n}의 소굴에 들어섰다.`);
  await LS.set(id,fresh);save(h);
}
function coGo(f){f.status="active";f.log.push({k:"amb",x:`${f.members.length}명이 나란히 어둠 속으로 들어선다.`})}
async function coStart(){const r=myRun();if(!r||r.members[0]!==myId())return;

async function coCancel(){const r=myRun();if(!r)return;const h=structuredClone(me);

  else if(r.status==="invite"){await coEdit(f=>f.status==="invite",f=>{f.members=f.members.filter(x=>x!==myId());delete f.roles[myId()];f.log.push({k:"amb",x:`${josa(me.name,"이")} 어귀에서 발길을 돌렸다.`})});if(h.raid?.tries?.n)h.raid.tries.n--}

function coPickFork(i){const r=myRun();if(!r)return;const step=r.step;

function coRoomAct(opt){const r=myRun();if(!r)return;const step=r.step;
  coEdit(f=>f.status==="active"&&f.phase==="room"&&f.step===step,f=>{

async function coHerb(){const r=myRun();if(!r||me.items.herb<1)return;

function create(){

  if(!name){toast("강호에서 불릴 이름을 적어 주세요.");$("#hname").focus();return}
  if(!sect){toast("들어갈 문파를 골라 주세요.");return}
  const h=normalize({name:name.slice(0,12),sect,realm:0,level:1,exp:0,points:0,stats:{nei:10,wai:10,shen:10},frac:{nei:0,wai:0,shen:0},created:Date.now(),titles:{}});
  addLog(h,`${SECTS[sect].n}에 입문했다. 하남에서 강호행을 시작한다.`); save(h); toast(`${SECTS[sect].n}의 문하가 되었습니다.`);
}
function startTrain(){
  if(activity(me)){toast(`${busyText[activity(me)]} 수련할 수 없습니다.`);return}
  const now=Date.now(),h=structuredClone(me);
  h.training={stat:pick.stat,hours:pick.hours,start:now,end:now+pick.hours*3600e3,lvl:h.level,rm:h.realm};
  addLog(h,`${STATS[pick.stat].train} ${pick.hours}시간을 시작했다.`); confirmCancel=false; save(h);
}
function finishTrain(cancel){
  const h=structuredClone(me),t=h.training; if(!t) return;
  const f=cancel?Math.min(1,(Date.now()-t.start)/(t.end-t.start))*.5:1;
  const g=trainGain(t,f), lv0=h.level, ups=applyExp(h,g.exp), w=applyStat(h,t.stat,g.stat);
  h.training=null;
  addLog(h,`${STATS[t.stat].train}${cancel?"을 중도에 그만두었다":"을 마쳤다"}. 경험치 +${g.exp}${w?`, ${STATS[t.stat].n} +${w}`:""}${ups?`, Lv.${lv0}→${h.level}`:""}`);
  confirmCancel=false; save(h);
  toast(ups?`레벨이 올랐습니다! Lv.${h.level} · 능력치 포인트 +${ups*3}`:cancel?"쌓인 기운의 절반만 거두었습니다.":"수련을 마쳤습니다.");
}
function promote(){
  const h=structuredClone(me); if(!atWall(h)) return;
  const next=REALMS[h.realm+1]; if(!next||next.gate) return;
  h.realm++; h.points+=5; applyExp(h,0);
  addLog(h,`${next.n}의 경지에 올랐다.`); save(h); toast(`${next.n}에 올랐습니다! 보너스 포인트 +5`);
}
function commitAlloc(){
  const h=structuredClone(me),used=alloc.nei+alloc.wai+alloc.shen; if(!used) return;
  for(const k in alloc) h.stats[k]+=alloc[k];

  alloc={nei:0,wai:0,shen:0}; save(h);

  if(activity(h)){toast(`${busyText[activity(h)]} 떠날 수 없습니다.`);return}
  if(!hrsNeed) return;
  const R=REGIONS[to]; if(R.minRealm&&h.realm<R.minRealm){toast(`${R.n}는 ${REALMS[R.minRealm].n} 이상만 들어갈 수 있습니다.`);return}
  const now=Date.now(); h.travel={from:h.loc,to,start:now,end:now+hrsNeed*3600e3};
  addLog(h,`${REGIONS[h.loc].n}을 떠나 ${R.n}로 향한다.${h.horse?` (${josa(h.horse.n,"을")} 타고)`:ride?` (${josa(ride.name,"의")} 말 ${ride.horse.n}에 함께 올라)`:""}`); dest=null; save(h);

/* 강호 탭: 지도 + 지역 + 임무 */
function mapSvg(){
  const h=me,here=h.travel?null:h.loc,sel=dest;
  const roads=ROADS.map(([a,b,x])=>{const A=REGIONS[a],B=REGIONS[b];
    const go=h.travel&&((h.travel.from===a&&h.travel.to===b)||(h.travel.from===b&&h.travel.to===a));
    const near=here&&(a===here||b===here);
    return `<line class="road ${go?"go":near?"near":""}" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>
      ${(()=>{const L=Math.hypot(B.x-A.x,B.y-A.y),nx=-(B.y-A.y)/L,ny=(B.x-A.x)/L,s=ny>0?-1:1;return `<text class="hrs" x="${((A.x+B.x)/2+nx*9*s).toFixed(1)}" y="${((A.y+B.y)/2+ny*9*s+3).toFixed(1)}">${x}h</text>`})()}`}).join("");
  const nodes=Object.entries(REGIONS).map(([k,R])=>{const lock=R.minRealm&&h.realm<R.minRealm;
    return `<g class="node ${sel===k?"sel":""} ${lock?"lock":""}" data-r="${k}" tabindex="0" role="button" aria-label="${R.n}${k===here?" (현재 위치)":""}">
      <circle class="hit" cx="${R.x}" cy="${R.y}" r="22"/>${sel===k?`<circle class="ring2" cx="${R.x}" cy="${R.y}" r="13"/>`:""}
      ${k===here?`<rect class="here" x="${R.x-10}" y="${R.y-10}" width="20" height="20" rx="2" transform="rotate(-6 ${R.x} ${R.y})"/><text class="heret" x="${R.x}" y="${R.y+3}">我</text>`:`<circle class="pt" cx="${R.x}" cy="${R.y}" r="5"/>`}
      <text class="name" x="${R.x}" y="${R.y+28}">${R.n}</text></g>`}).join("");
  const mates=others.map((o,i)=>{const R=REGIONS[o.travel?o.travel.from:o.loc||"henan"];if(!R)return "";const dx=14+((i*9)%18),dy=-12-((i*7)%10);
    return `<circle class="mate" cx="${R.x+dx}" cy="${R.y+dy}" r="3"/><text class="matet" x="${R.x+dx+5}" y="${R.y+dy+3}">${esc(o.name)}</text>`}).join("");
  let me2="";
  if(h.travel){const A=REGIONS[h.travel.from],B=REGIONS[h.travel.to];
    me2=`<g id="traveler"><rect class="here" x="-8" y="-8" width="16" height="16" rx="2" transform="rotate(-6)"/><text class="heret" y="3">我</text></g>`;}
  return `<div class="mapbox"><svg class="map" viewBox="0 0 400 270" role="img" aria-label="중원 지도">
    <path class="river" d="M20,58 C80,52 120,74 175,82 S290,70 395,58"/><text class="rname" x="300" y="56">황하</text>
    <path class="river" d="M70,248 C130,236 180,250 240,242 S330,252 395,236"/><text class="rname" x="250" y="262">장강</text>
    ${roads}${nodes}${mates}${me2}</svg></div>`;
}
function worldTab(){

    else{const rt=route(h.loc,dest);regionBox+=`<p class="note">바로 가는 길이 없다. ${rt.path.map(p=>REGIONS[p].n).join(" → ")} (모두 ${hrsTxt(hrsFor(h,rt.hours))}) 순으로 한 곳씩 이동해야 한다.</p>`}
  }

    <section><div class="label">사건</div>${missionBox()}${journalList()}</section>`;

function missionBox(){
  const h=me,m=h.mission,now=Date.now();
  if(!m){
    if(h.travel) return `<p class="empty">길 위에서는 사건을 맡을 수 없다. 목적지에 도착하면 그 지역의 사건을 볼 수 있다.</p>`;
    const p=periodNow(),a=activity(h),slots=incidentSlots(h.loc,p);
    const cards=slots.map((idx,d)=>{const inc=INC[h.loc][idx],D=DIFF[d],done=misDone(h,h.loc,d,p);
      return `<div class="case ${done?"done":""}" style="margin-bottom:12px"><div class="kicker">${REGIONS[h.loc].n} · <span class="diff d${d}">${D.n}</span> · 탐문 ${hrsTxt(missionHours(h.realm,d))}${done?" · 해결함":""}</div><h3>${inc.t}</h3>${done?"":`<p>${inc.i}</p>`}
        ${done?"":`<p class="note" style="margin:0 0 12px">조사 판정 목표 ${dcFor(h.realm)+D.dc} · 보상 ×${D.rw}${d===2?" · 장비·말이 더 잘 나온다":""}</p>
        <button class="btn ${d===2?"sealb":"solid"}" type="button" data-mis="${d}" ${a?"disabled":""}>이 사건을 맡는다</button>`}</div>`}).join("");
    return `<p class="note" style="margin-top:0">이 지역에 사건이 세 건 있다. 하나씩 맡을 수 있고, ${fmtDays(periodEnds(p)-now)} 뒤에 새 사건으로 바뀐다. 경지가 오를수록 탐문이 빨라진다${h.realm?` (지금 ${Math.round((1-REALM_SPEED[h.realm])*100)}% 빠름)`:""}.${a?` ${busyText[a]} 지금은 맡을 수 없다.`:""}</p>${cards}`;
  }
  const inc=INC[m.region][m.idx];
  if(m.phase==="wait"){const ready=now>=m.end;
    return `<div class="case"><div class="kicker">${REGIONS[m.region].n} · <span class="diff d${misDiff(m)}">${DIFF[misDiff(m)].n}</span> · 탐문</div><h3>${inc.t}</h3><p>${inc.i}</p>
      ${(()=>{const comp=companionFor(m),f=feedFor(h,m,comp),shown=f.filter(e=>e.t<=now),b=feedBonus(shown)+(comp?1:0);
        return `<div class="kicker" style="margin-top:6px">탐문 일지 · 조사 판정 +${b}${comp?`<span class="mate-pill">동행 <b>${esc(comp.name)}</b> · ${comp.rel}</span>`:""}</div><div class="feedwrap"><ul class="feed" id="inlineFeed" data-key="${m.start}-${shown.length}">${shown.map((e,i)=>feedLine(e,i===shown.length-1&&!ready)).join("")}
          ${ready?`<li class="amb"><span class="tm"></span><span class="body">— 탐문이 끝났다. 이제 현장으로 향할 때다.</span></li>`:`<li class="wait"><span class="tm"></span><span class="body">계속 탐문하는 중… 새 소식은 5분쯤마다 들어온다 · 탐문 끝까지 <span data-until="${m.end}"></span></span></li>`}</ul><div class="feedtools"><span class="note" style="margin:0">위로 올리면 앞의 내용을 볼 수 있다.</span><button class="btn sm ghost" type="button" id="readerBtn" data-read="live">일지 크게 보기</button></div></div>`})()}
      <p>${ready?"탐문을 마쳤다. 들어서면 탐문에서 얻은 것들을 챙기고 현장으로 간다.":"대화와 도움에 성공할수록 현장 조사가 쉬워진다. 화면을 닫아 둬도 탐문은 계속된다."}</p>
      <div class="row">${ready?`<button class="btn sealb" id="sceneBtn" type="button">현장에 들어선다</button>`
        :confirmAbort?`<button class="btn sealb" id="mxYes" type="button">사건에서 손 떼기</button><button class="btn ghost" id="mxNo" type="button">계속 탐문하기</button>`
        :`<button class="btn ghost" id="mxBtn" type="button">사건 포기</button>`}</div></div>`}
  const dc=misDc(h,m);
  const rolls=m.rolls.length?`<ul class="rolls">${m.rolls.map(r=>`<li><span class="die ${r.ok?"":"fail"}">${r.roll}</span>
      <span>${STATS[r.stat].n} · ${esc(r.txt)} — ${r.roll}+${r.bonus}=${r.roll+r.bonus} / 목표 ${r.dc} <span class="verdict ${r.ok?"":"fail"}">${r.ok?"단서를 찾았다":"허탕을 쳤다"}</span></span></li>`).join("")}</ul>`:"";
  let body="";
  if(m.step<2){const st=inc.s[m.step];
    body=`<p class="q">${m.step+1}. ${st.q}</p><div class="opts">${(()=>{const bm=bestOf(st.o.map(o=>o[0]),m.bonus,dc);return st.o.map(([k,t],i)=>{const c=optCheck(k,m.bonus,dc,chanceOf(Math.floor(me.stats[k]/10)+(m.bonus||0),dc)===bm);return `<button class="opt" type="button" data-inv="${i}">${c.b}<span>${t}</span>${c.s}</button>`}).join("")})()}</div>`}
  else if(m.step===2){
    body=`<p class="q">조사 끝에 <b>${inc.f}</b>와 마주쳤다. 무공 없이 세 합을 겨룬다.</p><button class="btn solid" id="fightBtn" type="button">맞서 싸운다</button>`}
  else{const f=m.fight,L=m.loot||(()=>{const x=rollMissionLoot(h,m);m.loot=x;const hh=structuredClone(me);hh.mission.loot=x;setTimeout(()=>save(hh),0);return x})(),r={t:L.t};
    body=`<p class="q">${inc.f}와의 세 합</p><ul class="fight">${f.log.map(l=>`<li>${l}</li>`).join("")}</ul>
      <p style="color:var(--ink)">${f.res==="win"?`${inc.f}를 쓰러뜨렸다.`:f.res==="lose"?"쓰러졌다. 겨우 몸을 피했다.":`${inc.f}가 달아났다.`} (남은 체력 ${f.php}/${f.maxHp})</p>
      <div class="kicker" style="margin-top:14px">결말 · ${TIER[r.t]}</div><p style="color:var(--ink)">${inc.e[r.t]}</p>
      <div class="kicker" style="margin-top:12px">얻은 것</div><div class="reward">${lootChips(L,m).map(x=>`<span>${esc(x)}</span>`).join("")}</div>
      <button class="btn sealb" id="finMisBtn" type="button">사건을 마무리한다</button>`}
  return `<div class="case"><div class="kicker">${REGIONS[m.region].n} · 현장 · 단서 ${m.clues}/2</div><h3>${inc.t}</h3>${rolls}${body}</div>`;
}

/* 1초마다: 남은 시간 갱신, 끝나는 순간 다시 그리기 */
let phaseKey="";
function curPhase(){
  const n=Date.now(),e=x=>x?(n>=x.end?"d":"r"):"-";
  const fc=me?.mission?.phase==="wait"?feedFor(me,me.mission,companionFor(me.mission)).filter(x=>x.t<=n).length:0;
  return me?[e(me.training),e(me.travel),e(me.mission),fc,...others.map(o=>e(o.training)+e(o.travel))].join(""):"";
}
function tick(){
  maybeResolve();maybeResolveLair();try{maybeResolveDuel()}catch(e){}
  if(!me) return;
  const k=curPhase(); if(k!==phaseKey){phaseKey=k;render();return}
  const now=Date.now();
  document.querySelectorAll("[data-until]").forEach(el=>el.textContent=fmtLeft(+el.dataset.until-now));
  document.querySelectorAll("[data-suntil]").forEach(el=>el.textContent=fmtLeft(+el.dataset.suntil-sNow()));
  const t=me.training,fg=$("#ringFg");
  if(t&&fg){const f=Math.min(1,(now-t.start)/(t.end-t.start)),g=trainGain(t,f);
    fg.style.strokeDashoffset=276.5*(1-f);$("#ringPct").textContent=Math.floor(f*100)+"%";
    $("#trainGain").textContent=`지금까지 쌓인 기운: 경험치 +${g.exp.toLocaleString()}, ${STATS[t.stat].n} +${g.stat.toFixed(2)}`}
  const tv=me.travel,el=$("#traveler");
  if(tv&&el){const f=Math.min(1,(now-tv.start)/(tv.end-tv.start)),A=REGIONS[tv.from],B=REGIONS[tv.to];
    el.setAttribute("transform",`translate(${A.x+(B.x-A.x)*f},${A.y+(B.y-A.y)*f})`)}
}

function drawMountains(){
  const c=$("#mount"),dpr=Math.min(2,devicePixelRatio||1),w=c.clientWidth,h=c.clientHeight;
  c.width=w*dpr;c.height=h*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue("--ink").trim(),paper=cs.getPropertyValue("--paper").trim();
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const layers=[{y:.50,a:.10,amp:38,b:4},{y:.62,a:.16,amp:30,b:2.5},{y:.74,a:.28,amp:26,b:1.2},{y:.88,a:.55,amp:16,b:0}];
  for(const L of layers){
    const ph=[rnd()*6,rnd()*6,rnd()*6];
    x.save();x.filter=L.b?`blur(${L.b}px)`:"none";x.globalAlpha=L.a;x.fillStyle=ink;x.beginPath();x.moveTo(0,h);
    for(let i=0;i<=w;i+=3){const t=i/w;
      const y=h*L.y-L.amp*(Math.sin(t*5+ph[0])*.6+Math.sin(t*11+ph[1])*.3+Math.sin(t*23+ph[2])*.12+(rnd()-.5)*.08)-(t>.55&&t<.8?L.amp*.8*Math.sin((t-.55)/.25*Math.PI):0);
      x.lineTo(i,y)}
    x.lineTo(w,h);x.closePath();x.fill();x.restore();
  }
  const g=x.createLinearGradient(0,h*.55,0,h);g.addColorStop(0,"transparent");g.addColorStop(1,paper);
  x.fillStyle=g;x.fillRect(0,0,w,h);
  x.globalAlpha=.12;x.fillStyle=ink;x.beginPath();x.arc(w*.82,h*.26,13,0,Math.PI*2);x.fill();
}
let rT;addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(drawMountains,150)});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>setTimeout(drawMountains,50));
new MutationObserver(()=>setTimeout(drawMountains,50)).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

  if(!C?.use){startLocal();return}
  const [d,u]=await Promise.all([C.use("db").catch(()=>null),C.use("user").catch(()=>null)]);

  const OLD=3*86400e3;let swept=0;
  const sweep=(col,docs)=>{if(sweep.done?.[col])return;sweep.done={...(sweep.done||{}),[col]:1};const now=Date.now();
    docs.filter(d=>{const x=d.data()||{},t=x.updated||x.end||x.start||x.created||x.t||0;return t&&now-t>OLD&&d.id!==me?.colair}).slice(0,30-swept)
      .forEach(d=>{swept++;db.doc(col+"/"+d.id).delete().catch(()=>{})})};
  db.collection("duels").onSnapshot(snap=>{sweep("duels",snap.docs.filter(d=>d.exists));duels={};snap.docs.forEach(d=>{if(d.exists)duels[d.id]=structuredClone(d.data())});if(ready)render();maybeResolveDuel()},()=>{});
  db.collection("notices").onSnapshot(snap=>{notices={};snap.docs.forEach(d=>{if(d.exists)notices[d.id]=structuredClone(d.data())});if(ready)render()},()=>{});
  db.collection("mail").onSnapshot(snap=>{mails={};snap.docs.forEach(d=>{if(d.exists)mails[d.id]=structuredClone(d.data())});if(ready)render()},()=>{});
  db.collection("avatars").onSnapshot(snap=>{avatars={};snap.docs.forEach(d=>{if(d.exists)avatars[d.id]=d.data().img});if(ready)render()},()=>{});
  db.collection("lairs").onSnapshot(snap=>{sweep("lairs",snap.docs.filter(d=>d.exists));lairRuns={};snap.docs.forEach(d=>{if(d.exists)lairRuns[d.id]=structuredClone(d.data())});if(ready)render();maybeResolveLair()},()=>{});
  db.collection("gates").onSnapshot(snap=>{sweep("gates",snap.docs.filter(d=>d.exists));gateRooms={};snap.docs.forEach(d=>{if(d.exists)gateRooms[d.id]=structuredClone(d.data())});if(ready)render();maybeResolve()},()=>{});
  db.collection("gateacts").onSnapshot(snap=>{const mine=gateActs[uid];gateActs={};snap.docs.forEach(d=>{if(d.exists)gateActs[d.id]=structuredClone(d.data())});
    if(mine&&(!gateActs[uid]||(gateActs[uid].t||0)<(mine.t||0)))gateActs[uid]=mine;if(ready)render();maybeResolve();maybeResolveLair();try{maybeResolveDuel()}catch(e){}},()=>{});
  db.collection("heroes").onSnapshot(snap=>{
    const mine=snap.docs.find(x=>x.id===uid);
    if(!(mine?.metadata?.hasPendingWrites)){me=mine?.exists?normalize(structuredClone(mine.data())):null;if(me){if(me.journal&&!journalCache)journalCache=me.journal;me.journal=journalCache||me.journal||[]}}
    others=snap.docs.filter(x=>x.id!==uid&&x.exists).map(x=>Object.assign(normalize(structuredClone(x.data())),{_id:x.id}));
    mergeFake();ready=true;render();syncBonds();
  },e=>{toast("강호 소식이 끊겼어요. 새로고침해 주세요.")});
  setTimeout(()=>{if(!ready){ready=true;render()}},8000);
}

/* ───────── 무림행 웹사이트 껍데기: 로그인 · 초대코드 가입 · 관리 · 저장소 연결 ───────── */
(function(){
  const cfg=window.FIREBASE_CONFIG;
  const $s=s=>document.querySelector(s);
  const ID_RE=/^[a-z0-9_]{3,16}$/;
  const idToEmail=id=>`${id}@murimhaeng.game`;
  let fs,auth,me={uid:null,id:null,admin:false};
  /* 기기 시계가 틀려도 모두 같은 시각을 쓰도록 서버 시각과의 차이를 잰다 */
  let skew=0;const srvNow=()=>Date.now()+skew;
  async function calibrate(){try{const r=fs.doc("leases/clock__"+me.uid),t0=Date.now();
    await r.set({t:firebase.firestore.FieldValue.serverTimestamp()});const s=await r.get({source:"server"}),t1=Date.now();
    const st=s.data().t;const ms=st?.toMillis?st.toMillis():+st;if(ms)skew=Math.round(ms-(t0+t1)/2)}catch(e){}}

  function adapter(){
    const wrap=d=>({id:d.id,exists:d.exists,data:()=>d.data(),metadata:{hasPendingWrites:d.metadata.hasPendingWrites,fromCache:d.metadata.fromCache}});
    const api={
      doc(path){const ref=fs.doc(path);return{
        set:data=>ref.set(data),update:data=>ref.update(data),delete:()=>ref.delete(),
        get:async()=>wrap(await ref.get()),
        onSnapshot:(n,e)=>ref.onSnapshot({includeMetadataChanges:true},s=>n(wrap(s)),e),
        acquire:async({holder,ttlMs})=>{const lr=fs.doc("leases/"+path.replace(/\//g,"__"));
          try{return await fs.runTransaction(async tx=>{const s=await tx.get(lr),now=srvNow();
            if(s.exists&&s.data().exp>now&&s.data().holder!==holder)return{acquired:false};
            tx.set(lr,{holder,exp:now+(ttlMs||30000)});return{acquired:true}})}catch(e){return{acquired:false}}}}},
      collection(path){const ref=fs.collection(path);return{
        doc:id=>api.doc(path+"/"+id),
        onSnapshot:(n,e)=>ref.onSnapshot({includeMetadataChanges:true},s=>n({docs:s.docs.map(wrap),size:s.size,empty:s.empty}),e)}}};
    return api;
  }
  function installClaude(){
    const db=adapter(),user={id:async()=>me.uid,isOwner:async()=>me.admin,canEdit:async()=>me.admin,me:async()=>({id:me.uid,name:me.id})};
    window.claude={use:async n=>n==="db"?db:n==="user"?user:null};
    window.__murim={fs,uid:me.uid,id:me.id,admin:me.admin,now:srvNow};calibrate();setTimeout(()=>dispatchEvent(new Event("murim-ready")),0);
  }

  /* 화면 */
  const css=`.gate-auth{position:fixed;inset:0;z-index:50;background:var(--paper);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
  .gate-auth[hidden]{display:none}
  .ga-box{width:100%;max-width:380px;display:grid;gap:14px}
  .ga-box h1{font-family:var(--f-brush);font-size:46px;letter-spacing:.08em;line-height:1}
  .ga-box .sub{color:var(--ink-3);font-size:13px;letter-spacing:.14em;margin-top:-6px}
  .ga-tabs{display:flex;border-bottom:1px solid var(--line)}
  .ga-tabs button{flex:1;background:none;border:0;padding:10px;font-family:var(--f-brush);font-size:18px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
  .ga-tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
  .ga-f{display:grid;gap:4px}
  .ga-f label{font-size:12px;color:var(--ink-3);letter-spacing:.12em}
  .ga-f input{font:inherit;font-size:17px;padding:9px 4px;border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:var(--ink)}
  .ga-f small{font-size:12px;color:var(--seal)}
  .ga-err{color:var(--seal);font-size:14px;min-height:1.2em}
  .acct{position:relative;z-index:2;display:flex;justify-content:flex-end;gap:8px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:-8px}
  .acct button{background:none;border:1px solid var(--line);padding:3px 9px;font-size:12px;color:var(--ink-2);border-radius:2px}
  .admin{position:fixed;inset:0;z-index:40;background:var(--paper);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .admin[hidden]{display:none}
  .admin>div{max-width:720px;margin:0 auto;display:grid;gap:14px}
  .admin table{width:100%;border-collapse:collapse;font-size:13px}
  .admin td,.admin th{text-align:left;border-bottom:1px solid var(--line);padding:6px 4px}
  .admin code{font-size:14px;letter-spacing:.06em}`;
  const st=document.createElement("style");st.textContent=css;document.head.appendChild(st);
  const box=document.createElement("div");box.className="gate-auth";box.id="gateAuth";
  box.innerHTML=`<div class="ga-box"><div><h1>무림행</h1><div class="sub">武林行 · 초대받은 사람만 들어올 수 있는 강호</div></div>
    <div class="ga-tabs" role="tablist"><button type="button" role="tab" id="gaTabIn" aria-selected="true">들어가기</button><button type="button" role="tab" id="gaTabUp" aria-selected="false">처음 왔어요</button></div>
    <form id="gaForm" novalidate>
      <div style="display:grid;gap:14px">
      <div class="ga-f"><label for="gaId">아이디</label><input id="gaId" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="영문 소문자·숫자 3~16자"></div>
      <div class="ga-f"><label for="gaPw">비밀번호</label><input id="gaPw" type="password" autocomplete="current-password" placeholder="6자 이상"><small>다른 사이트에서 쓰지 않는 비밀번호로 입력해 주세요.</small></div>
      <div class="ga-f" id="gaCodeRow" hidden><label for="gaCode">초대코드</label><input id="gaCode" autocapitalize="characters" spellcheck="false" placeholder="받은 초대코드"></div>
      <div class="ga-err" id="gaErr" role="alert"></div>
      <button class="btn solid" type="submit" id="gaGo">들어가기</button>
      <p class="note" id="gaNote" style="margin:0">비밀번호를 잊으면 관리자에게 말해 주세요. 캐릭터는 그대로 옮겨 줄 수 있어요.</p></div>
    </form></div>`;
  document.body.appendChild(box);
  const admin=document.createElement("div");admin.className="admin";admin.id="adminPanel";admin.hidden=true;document.body.appendChild(admin);
  let signup=false;
  function setTab(up){signup=up;$s("#gaTabIn").setAttribute("aria-selected",!up);$s("#gaTabUp").setAttribute("aria-selected",up);$s("#gaCodeRow").hidden=!up;
    $s("#gaGo").textContent=up?"초대코드로 가입하기":"들어가기";$s("#gaPw").autocomplete=up?"new-password":"current-password";$s("#gaErr").textContent=""}
  $s("#gaTabIn").onclick=()=>setTab(false);$s("#gaTabUp").onclick=()=>setTab(true);
  const err=t=>{$s("#gaErr").textContent=t};
  const busy=b=>{$s("#gaGo").disabled=b};

  if(!cfg||!cfg.apiKey||String(cfg.apiKey).includes("여기")){err("설정 파일(config.js)에 Firebase 설정값이 아직 없어요.");busy(true);return}
  firebase.initializeApp(cfg);auth=firebase.auth();fs=firebase.firestore();
  /* 한 번 받은 기록과 대화는 이 기기에 저장해 두고, 바뀐 것만 다시 받는다 (읽기 횟수 절약) */
  try{fs.enablePersistence&&fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}

  $s("#gaForm").addEventListener("submit",async e=>{
    e.preventDefault();err("");
    const id=$s("#gaId").value.trim().toLowerCase(),pw=$s("#gaPw").value,code=$s("#gaCode").value.replace(/\s+/g,"").toUpperCase();
    if(!ID_RE.test(id))return err("아이디는 영문 소문자, 숫자, _ 로 3~16자예요.");
    if(pw.length<6)return err("비밀번호는 6자 이상이어야 해요.");
    busy(true);
    try{
      if(signup){
        if(!code)throw{code:"no-code"};
        signingUp=true;
        const cred=await auth.createUserWithEmailAndPassword(idToEmail(id),pw);
        try{const b=fs.batch();
          b.set(fs.doc("users/"+cred.user.uid),{id,code,created:Date.now()});
          b.update(fs.doc("invites/"+code),{used:true,usedBy:cred.user.uid,usedAt:Date.now()});
          await b.commit();
        }catch(x){await cred.user.delete().catch(()=>{});signingUp=false;throw{code:"bad-code",why:x.code||x.message||""}}
        signingUp=false;await enter(cred.user);
      }else await auth.signInWithEmailAndPassword(idToEmail(id),pw);
    }catch(x){
      signingUp=false;
      const c=x.code||"";
      err(c==="no-code"?"초대코드를 넣어 주세요.":c==="bad-code"?`초대코드가 맞지 않거나 이미 쓰인 코드예요. (${code} · ${x.why})`:c.includes("email-already-in-use")?"이미 있는 아이디예요. 다른 아이디를 골라 주세요."
        :c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")?"아이디나 비밀번호가 맞지 않아요.":c.includes("too-many-requests")?"시도가 너무 많아요. 잠시 뒤에 다시 해 주세요."
        :c.includes("network")?"인터넷 연결을 확인해 주세요.":"들어가지 못했어요. ("+c+")");
    }finally{busy(false)}
  });

  let started=false,signingUp=false;
  /* 가입 중에는 초대코드 처리가 끝난 뒤에 직접 확인한다 (먼저 확인하면 아직 회원이 아니라서 막힌다) */
  auth.onAuthStateChanged(u=>{if(signingUp)return;enter(u)});
  async function enter(u){
    if(!u){if(started)location.reload();box.hidden=false;return}
    try{let s;try{s=await fs.doc("users/"+u.uid).get()}catch(e){await new Promise(r=>setTimeout(r,900));s=await fs.doc("users/"+u.uid).get()}
      if(!s.exists){err("가입이 끝나지 않은 계정이에요. 초대코드로 다시 가입해 주세요.");await auth.signOut();return}
      me={uid:u.uid,id:s.data().id,admin:s.data().admin===true};
    }catch(x){err("계정을 확인하지 못했어요. 새로고침해 주세요.");return}
    box.hidden=true;
    if(!started){started=true;installClaude();accountBar();window.__startGame&&window.__startGame()}
  }

  function accountBar(){
    const bar=document.createElement("div");bar.className="acct";
    bar.innerHTML=`<span>${me.id}${me.admin?" · 관리자":""}</span>${me.admin?`<button type="button" id="adminOpen">관리</button>`:""}<button type="button" id="logout">나가기</button>`;
    const w=document.querySelector(".wrap");w.insertBefore(bar,w.querySelector("#status"));
    $s("#logout").onclick=()=>auth.signOut();
    if(me.admin)$s("#adminOpen").onclick=openAdmin;
  }

  /* 관리 화면: 초대코드 만들기, 사람 목록, 캐릭터 옮기기 */
  const rnd=n=>Array.from({length:n},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
  async function openAdmin(){
    admin.hidden=false;admin.innerHTML=`<div><div class="rhead"><div><div class="kicker">관리</div><h2>무림행 관리</h2></div><button class="btn ghost" type="button" id="adClose">닫기</button></div><p class="note">불러오는 중…</p></div>`;
    $s("#adClose").onclick=()=>admin.hidden=true;
    const [inv,users,heroes]=await Promise.all([fs.collection("invites").get(),fs.collection("users").get(),fs.collection("heroes").get()]);
    const hname={};heroes.docs.forEach(d=>hname[d.id]=d.data().name);
    const uid2id={};users.docs.forEach(d=>uid2id[d.id]=d.data().id);
    const invRows=inv.docs.sort((a,b)=>(b.data().created||0)-(a.data().created||0)).map(d=>{const x=d.data();return `<tr><td><code>${d.id}</code></td><td>${x.used?`사용됨 · ${uid2id[x.usedBy]||"?"}`:"아직 안 씀"}</td><td>${x.note||""}</td></tr>`}).join("");
    const userRows=users.docs.map(d=>{const x=d.data();return `<tr><td>${x.id}${x.admin?" (관리자)":""}</td><td>${hname[d.id]||"캐릭터 없음"}</td><td><code style="font-size:11px">${d.id}</code></td></tr>`}).join("");
    admin.querySelector("div").innerHTML=`<div class="rhead"><div><div class="kicker">관리</div><h2>무림행 관리</h2></div><button class="btn ghost" type="button" id="adClose">닫기</button></div>
      <section><div class="label">초대코드</div><div class="row"><input id="adNote" placeholder="누구에게 줄 코드인지 메모 (선택)" style="flex:1;min-width:0;font:inherit;padding:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)"><button class="btn sealb" type="button" id="adMake">초대코드 만들기</button></div>
        <p class="note">코드 하나로 한 사람만 가입할 수 있다. 만든 코드를 친구에게 직접 전해 주자.</p>
        <div class="mapbox"><table><tr><th>코드</th><th>상태</th><th>메모</th></tr>${invRows||"<tr><td colspan=3>아직 없음</td></tr>"}</table></div></section>
      <section><div class="label">강호의 사람들</div><div class="mapbox"><table><tr><th>아이디</th><th>캐릭터</th><th>계정 번호</th></tr>${userRows}</table></div></section>
      <section><div class="label">캐릭터 옮기기</div><p class="note">비밀번호를 잊은 사람은 새 초대코드로 새 아이디를 만들게 한 뒤, 옛 계정의 캐릭터를 새 계정으로 옮겨 준다.</p>
        <div class="row"><select id="adFrom">${users.docs.map(d=>`<option value="${d.id}">${d.data().id} · ${hname[d.id]||"캐릭터 없음"}</option>`).join("")}</select> → <select id="adTo">${users.docs.map(d=>`<option value="${d.id}">${d.data().id}</option>`).join("")}</select>
        <button class="btn" type="button" id="adMove">옮기기</button></div><p class="ga-err" id="adMsg"></p></section>`;
    $s("#adClose").onclick=()=>admin.hidden=true;
    $s("#adMake").onclick=async()=>{const code=`MURIM-${rnd(4)}`;await fs.doc("invites/"+code).set({used:false,usedBy:null,created:Date.now(),note:$s("#adNote").value.trim().slice(0,40)});openAdmin()};
    $s("#adMove").onclick=async()=>{const f=$s("#adFrom").value,t=$s("#adTo").value;if(f===t)return $s("#adMsg").textContent="같은 계정이에요.";
      const s=await fs.doc("heroes/"+f).get();if(!s.exists)return $s("#adMsg").textContent="옮길 캐릭터가 없어요.";
      await fs.doc("heroes/"+t).set(s.data());await fs.doc("heroes/"+f).delete();
      const j=await fs.doc("journals/"+f).get();if(j.exists){await fs.doc("journals/"+t).set(j.data());await fs.doc("journals/"+f).delete()}$s("#adMsg").textContent="옮겼어요.";openAdmin()};
  }
})();

/* ───────── 브금: 백그라운드 재생 (두 곡을 이어 붙인 bgm.mp3 하나를 계속 반복) ───────── */
(function(){
  const st=document.createElement("style");st.textContent=`
  .bgm-btn{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:8px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink-2);padding:8px 14px;border-radius:30px;font:inherit;font-size:13px;cursor:pointer}
  .bgm-btn i{display:inline-flex;gap:2px;height:12px;align-items:flex-end}.bgm-btn i b{width:2px;height:3px;background:var(--ink-2);border-radius:1px}
  .bgm-btn.on i b{animation:bgmw 1.4s ease-in-out infinite}.bgm-btn.on i b:nth-child(2){animation-delay:.25s}.bgm-btn.on i b:nth-child(3){animation-delay:.5s}
  @keyframes bgmw{50%{height:12px}}
  @media (prefers-reduced-motion:reduce){.bgm-btn.on i b{animation:none}}`;document.head.appendChild(st);
  const btn=document.createElement("button");btn.type="button";btn.className="bgm-btn";btn.setAttribute("aria-pressed","false");
  btn.innerHTML=`<i aria-hidden="true"><b></b><b></b><b></b></i><span>브금 켜기</span>`;document.body.appendChild(btn);
  const au=new Audio();au.preload="none";au.loop=true;au.volume=.55;let on=false;
  const label=t=>{btn.classList.toggle("on",on);btn.setAttribute("aria-pressed",on);btn.querySelector("span").textContent=t||(on?"브금 끄기":"브금 켜기")};
  au.addEventListener("error",()=>{on=false;label("브금 파일을 못 찾았어요")});
  btn.addEventListener("click",async()=>{
    if(on){au.pause();on=false;label();return}
    if(!au.src){au.src="bgm.mp3";if("mediaSession" in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:"무림행 브금",artist:"Ancient Bamboo Harmony · Soft Pads & Bamboo Flute"})}
    try{await au.play();on=true;label()}catch(e){on=false;label("다시 눌러 주세요")}
  });
  if("mediaSession" in navigator){
    navigator.mediaSession.setActionHandler("play",()=>{au.play();on=true;label()});
    navigator.mediaSession.setActionHandler("pause",()=>{au.pause();on=false;label()});
  }
})();

   chat/{채널}/msgs 에 서버·지역 대화, dm/{두 사람 번호}/msgs 에 1:1 대화를 쌓는다. */
